[package]
name = "game-2048-wasm"
version = "0.1.0"
edition = "2021"
description = "2048 game with graph"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
rand = {version = "0.10.2"}
getrandom = { version = "0.4", features = ["wasm_js"] }
petgraph = { version = "0.8", features = ["serde-1"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
