[package]
name = "game-core"
version = "0.1.0"
edition = "2021"
description = "Shared 2048 game logic — no I/O, no rendering"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.10.2" }
getrandom = { version = "0.4", features = ["wasm_js"] }
petgraph = { version = "0.8", features = ["serde-1"] }

[dev-dependencies]
