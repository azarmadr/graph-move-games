[package]
name = "game-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for the 2048 game engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
game-core = { path = "../core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
